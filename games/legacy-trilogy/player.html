<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign player</title><style>html,body,#game{height:100%;width:100%;margin:0;background:#101017;color:white}
body{display:flex;flex-direction:column}#game{flex:1;min-height:0}
#controls{font:14px system-ui;background:#181822;padding:6px 12px;display:flex;gap:1rem;flex-wrap:wrap}
#controls[hidden]{display:none}#controls label{cursor:pointer;padding:3px}
body:has(#walk:checked) canvas{cursor:crosshair;touch-action:none}
#controls .hint{opacity:.6}
</style></head>
<body><div id="controls" hidden><label title="Left-click to walk, attack or talk. Right-click for options."><input id="walk" type="checkbox" checked> Point and click</label>
<label title="Press A when you arrive: talk to people, open chests, pick up items."><input id="interact" type="checkbox" checked> Auto-interact</label>
<label title="Fight back when an enemy comes close."><input id="battle" type="checkbox"> Auto-retaliate</label><span class="hint">Left-click: walk / attack / talk · Right-click: options · Click text to continue · Move: WASD/arrows · A: Space/J/Z · B: K/X · Start: Enter/E</span></div><div id="game"></div><script type="module">
import {attachControls} from './field-controls.mjs';
import {trilogyControls} from './keyboard.mjs';
import {patchRom} from './romhack.mjs';
const parentGame = window.parent.trilogySession;
if (parentGame) {
  const rom = await patchRom(parentGame.code, parentGame.bytes);
  const url=URL.createObjectURL(new Blob([rom.bytes]));
  Object.assign(window,{
    EJS_player:'#game',EJS_core:'mgba',EJS_gameUrl:url,EJS_gameName:'Trilogy-'+parentGame.code,
    EJS_pathtodata:'./engine/',EJS_startOnLoaded:true,EJS_threads:false,EJS_DEBUG_XX:true,
    EJS_defaultControls:trilogyControls(parentGame.code),
    EJS_disableDatabases:true,EJS_disableAutoLang:true,
    EJS_onGameStart:()=>{parentGame.started(window.EJS_emulator.gameManager); attachControls(window.EJS_emulator,parentGame.code,rom.hacked);},
  });
  const loader=document.createElement('script');loader.src='./engine/loader.js';
  loader.onerror=()=>parentGame.failed('The campaign player could not load.');
  document.body.append(loader);
  addEventListener('pagehide',()=>URL.revokeObjectURL(url));
}
</script></body></html>
